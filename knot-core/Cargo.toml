[package]
name = "knot-core"
version = "0.1.0"
edition = "2021"
description = "KnotYup protocol core: discovery, groups, clipboard sync"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
local-ip-address = "0.6"
arboard = "3"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
