<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnotYup</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="toastify.min.css" />
  <style>
    /* 开屏层：内联样式确保先于 JS/CSS 就绪即渲染，消除白屏 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      /* 透明：露出底层液态流动背景 */
      display: grid; place-items: center;
      transition: opacity .45s cubic-bezier(.22, 1, .36, 1);
    }
    #boot-splash.out { opacity: 0; pointer-events: none; }
    .boot-inner { display: flex; flex-direction: column; align-items: center; }
    .boot-inner svg { width: 96px; height: 96px; }
    .boot-knot path {
      stroke: #1d2129;
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: boot-draw 1s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    .boot-inner .boot-word {
      margin-top: 14px;
      font-family: inherit;
      font-size: 20px; font-weight: 700; color: #1d2129;
    }
    /* 逐字蹦跳：回弹缓动 + 交错延迟 */
    .boot-word span {
      display: inline-block;
      opacity: 0;
      transform: translateY(16px) scale(.5);
      animation: boot-pop .65s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }
    .boot-word span:nth-child(1) { animation-delay: .78s; }
    .boot-word span:nth-child(2) { animation-delay: .84s; }
    .boot-word span:nth-child(3) { animation-delay: .90s; }
    .boot-word span:nth-child(4) { animation-delay: .96s; }
    .boot-word span:nth-child(5) { animation-delay: 1.02s; }
    .boot-word span:nth-child(6) { animation-delay: 1.08s; }
    .boot-word span:nth-child(7) { animation-delay: 1.14s; }
    @keyframes boot-draw { to { stroke-dashoffset: 0; } }
    @keyframes boot-pop {
      0%   { opacity: 0; transform: translateY(16px) scale(.5); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <canvas id="liquid-bg" aria-hidden="true"></canvas>
  <!-- 开屏：绳结描线 + 品牌浮现，JS 初始化完成后淡出 -->
  <div id="boot-splash">

      </svg>
      <div class="boot-word"><span>K</span><span>n</span><span>o</span><span>t</span><span>Y</span><span>u</span><span>p</span></div>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none">
    <!-- 顶栏 -->
    <header class="topbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <div class="brand-mark">
          <svg class="icon"><use href="#i-knot"/></svg>
        </div>
        <span class="brand-name">KnotYup</span>
      </div>
      <div class="topbar-right">
        <!-- 群信息分享（群主，群页面显示） -->
        <div class="theme-picker hidden" id="sharePicker">
          <button id="btnShare" class="icon-btn" title="Group Info">
            <svg class="icon"><use href="#i-share"/></svg>
          </button>
          <div id="sharePop" class="share-pop hidden"></div>
        </div>
        <div class="theme-picker">
          <button id="btnTheme" class="icon-btn" title="Theme">
            <svg class="icon"><use href="#i-palette"/></svg>
          </button>
          <div id="themeSwatches" class="theme-swatches hidden"></div>
        </div>
        <div class="theme-picker">
          <button id="btnLang" class="icon-btn" title="Language">简</button>
          <div id="langMenu" class="lang-menu hidden"></div>
        </div>
      </div>
    </header>

    <!-- 主内容：未入组 -->
    <main id="viewHome" class="view home">
      <div class="hero">
        <h1><span data-i18n="tagline_1"></span><em data-i18n="tagline_2"></em></h1>
        <p data-i18n="tagline_sub"></p>
      </div>
      <div class="cards">
        <!-- 左卡：加入 / 创建 -->
        <section class="card join" style="--i:0">
          <div class="card-icon">
            <svg class="icon lg"><use href="#i-link"/></svg>
          </div>
          <h2 data-i18n="join_group"></h2>
          <p data-i18n="join_desc"></p>
          <input id="inputAddr" class="input" data-i18n-placeholder="addr_placeholder" spellcheck="false" />
          <input id="inputPin" class="input" data-i18n-placeholder="pin_placeholder" maxlength="6" inputmode="numeric" spellcheck="false" />
          <div class="btn-row">
            <button class="btn" id="btnCreate">
              <svg class="icon sm"><use href="#i-plus"/></svg>
              <span data-i18n="btn_create"></span>
            </button>
            <button class="btn primary" id="btnJoin" data-i18n="btn_join"></button>
          </div>
        </section>

        <!-- 右卡：局域网发现的群 -->
        <section class="card discovered-card" style="--i:1">
          <div class="card-icon">
            <svg class="icon lg"><use href="#i-devices"/></svg>
          </div>
          <h2 data-i18n="discovered"></h2>
          <p data-i18n="discovering"></p>
          <div class="discovered-list" id="discoveredList"></div>
        </section>
      </div>
      <!-- 版号（双击在浏览器打开调试日志页；与 tauri.conf.json version 保持同步） -->
      <div class="version-badge" id="versionBadge" title="双击打开调试日志 http://127.0.0.1:45692">v0.1.0</div>
    </main>

    <!-- 主内容：已入组 -->
    <main id="viewGroup" class="view group hidden">
      <aside class="panel members-panel">
        <div class="panel-head">
          <svg class="icon sm muted"><use href="#i-devices"/></svg>
          <h2 data-i18n="devices"></h2>
          <span id="memberCount" class="count">1</span>
        </div>
        <ul id="memberList" class="member-list"></ul>

        <button class="btn danger" id="btnLeave"></button>
      </aside>

      <section class="panel clip-panel">
        <div class="panel-tabs">
          <button class="panel-tab active" data-tab="clipboard" data-i18n="clipboard"></button>
          <button class="panel-tab" data-tab="files" data-i18n="files"></button>
        </div>
        <div class="panel-pane" id="paneClipboard">
          <div class="panel-head">
            <svg class="icon sm muted"><use href="#i-clipboard"/></svg>
            <span class="hint" data-i18n="click_hint"></span>
          </div>
          <ul id="clipList" class="clip-list">
            <li class="empty" id="clipEmpty"></li>
          </ul>
        </div>
        <div class="panel-pane hidden" id="paneFiles">
          <div class="panel-head file-head">
            <button class="file-back hidden" id="btnFileBack"><svg class="icon sm"><use href="#i-back"/></svg><span data-i18n="back"></span></button>
            <button class="btn-mini" id="btnShareFile"><svg class="icon sm"><use href="#i-plus"/></svg><span data-i18n="share_file"></span></button>
          </div>
          <div id="fileList" class="file-list"></div>
        </div>
      </section>
    </main>

    <!-- 确认弹窗 -->
    <div id="confirmModal" class="modal-overlay hidden">
      <div class="modal">
        <h3 id="confirmTitle"></h3>
        <p id="confirmMsg"></p>
        <div id="confirmList" class="confirm-list hidden"></div>
        <div class="modal-actions">
          <button class="btn" id="confirmCancel"></button>
          <button class="btn danger" id="confirmOk"></button>
        </div>
      </div>
    </div>

    <!-- 加入群（PIN）弹窗 -->
    <div id="pinModal" class="modal-overlay hidden">
      <div class="modal">
        <h3 id="pinTitle"></h3>
        <div class="pin-name" id="pinName"></div>
        <div class="pin-addr" id="pinAddr"></div>
        <input id="pinInput" class="input pin-input" maxlength="6" inputmode="numeric" spellcheck="false" autofocus />
        <div class="modal-actions">
          <button class="btn" id="pinCancel"></button>
          <button class="btn primary" id="pinJoin"></button>
        </div>
      </div>
    </div>

    <!-- 加入群 Loading -->
    <div id="loadingModal" class="modal-overlay hidden">
      <div class="modal loading-modal">
        <div class="spinner"></div>
        <p id="loadingText" class="loading-text"></p>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="liquid.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="toastify.min.js"></script>
  <script src="common.js"></script>
  <script src="home.js"></script>
  <script src="group.js"></script>
  <script src="app.js"></script>
</body>
</html>
