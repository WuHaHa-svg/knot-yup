<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnotYup</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* 开屏层：内联样式确保先于 JS/CSS 就绪即渲染，消除白屏 */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #ffffff;
      display: grid; place-items: center;
      transition: opacity .45s cubic-bezier(.22, 1, .36, 1);
    }
    #boot-splash.out { opacity: 0; pointer-events: none; }
    .boot-inner { display: flex; flex-direction: column; align-items: center; }
    .boot-inner svg { width: 96px; height: 96px; }
    .boot-knot path {
      stroke: #1d2129;
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: boot-draw 1s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    .boot-inner svg .boot-grad path { transition: stroke .6s ease .1s; }
    .boot-inner .boot-word {
      margin-top: 14px;
      font-family: inherit;
      font-size: 20px; font-weight: 700; color: #1d2129;
      opacity: 0; transform: translateY(8px);
      animation: boot-rise .5s cubic-bezier(.22, 1, .36, 1) .75s forwards;
    }
    @keyframes boot-draw { to { stroke-dashoffset: 0; } }
    @keyframes boot-rise { to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <!-- 开屏：绳结描线 + 品牌浮现，JS 初始化完成后淡出 -->
  <div id="boot-splash">
    <div class="boot-inner">
      <svg viewBox="0 0 24 24" class="boot-knot">
        <path pathLength="100" d="M9 15 L9 3 M9 3 C9 3 4 5 4 10 M15 9 L15 21 M15 21 C15 21 20 19 20 14 M6 18 C6 18 9 20 12 18 M18 6 C18 6 15 4 12 6"/>
      </svg>
      <div class="boot-word">KnotYup</div>
    </div>
  </div>
  <!-- SVG 图标库：所有图标统一 stroke 风格（1.8 / round），通过 <use href="#i-*"/> 引用 -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-knot" viewBox="0 0 24 24" fill="none">
      <path d="M9 15 L9 3 M9 3 C9 3 4 5 4 10 M15 9 L15 21 M15 21 C15 21 20 19 20 14 M6 18 C6 18 9 20 12 18 M18 6 C18 6 15 4 12 6"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none">
      <path d="M10 14a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11 5.9M14 10a5 5 0 0 0-7.07 0L4.1 12.83a5 5 0 0 0 7.07 7.07L13 18.1"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-crown" viewBox="0 0 24 24" fill="none">
      <path d="M4 18h16M4 18l-1-9 5 3 4-6 4 6 5-3-1 9H4z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none">
      <rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none">
      <path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2M9 12h11m0 0-3-3m3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-devices" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="5" width="13" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/>
      <path d="M2 19h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="16" y="9" width="6" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24" fill="none">
      <rect x="5" y="4" width="14" height="17" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
      <path d="M9 4.5V3.8A1.8 1.8 0 0 1 10.8 2h2.4A1.8 1.8 0 0 1 15 3.8v.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M9 10h6M9 14h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-flip" viewBox="0 0 24 24" fill="none">
      <path d="M4 9a8 8 0 0 1 13.6-3.4L20 8M20 4v4h-4M20 15a8 8 0 0 1-13.6 3.4L4 16M4 20v-4h4"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none">
      <path d="M20 11a8 8 0 0 0-14-4.5L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4.5l2-2.5M20 20v-5h-5"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-os-mac" viewBox="0 0 24 24">
      <path fill="currentColor" d="M16.4 12.9c0-2 1.6-3 1.7-3.1-.9-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 7.9.7.9 1.5 1.9 2.6 1.9 1 0 1.4-.6 2.7-.6s1.6.6 2.7.6c1.1 0 1.8-1 2.5-2 .8-1.2 1.1-2.3 1.1-2.4-.1 0-2.3-.8-2.5-2.7zM14.4 6.6c.6-.7.9-1.7.8-2.6-.9 0-2 .6-2.6 1.3-.6.6-1 1.6-.9 2.6 1 .1 2-.5 2.7-1.3z"/>
    </symbol>
    <symbol id="i-os-win" viewBox="0 0 24 24" fill="none">
      <path d="M3.5 5.5h7.2v6H3.5zM13.3 5.5h7.2v8.5h-7.2zM3.5 12.5h7.2v6H3.5zM13.3 15h7.2v3.5h-7.2z"
        stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-os-android" viewBox="0 0 24 24" fill="none">
      <path d="M7 10a5 5 0 0 1 10 0v6.5H7zM7 13h10M8.7 5.6 7.4 3.8M15.3 5.6l1.3-1.8M6.5 16.5v2M17.5 16.5v2"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10" cy="8.3" r="0.9" fill="currentColor"/>
      <circle cx="14" cy="8.3" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none">
      <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.7"/>
      <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.7"/>
      <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.6" stroke="currentColor" stroke-width="1.7"/>
      <path d="M14 14h3v3h-3zM19.5 14h1M14 19.5v1M17.5 17.5h3v3h-3z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-palette" viewBox="0 0 24 24" fill="none">
      <path d="M12 21a9 9 0 1 1 9-9c0 2.2-1.8 3-3.5 3H16a2 2 0 0 0-1.5 3.3c.4.5.5 1.2.1 1.7-.4.6-1.2 1-2.6 1z"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7.5" cy="11" r="1.2" fill="currentColor"/>
      <circle cx="10.5" cy="7" r="1.2" fill="currentColor"/>
      <circle cx="15" cy="7.5" r="1.2" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="app" id="appRoot" style="display:none">
    <!-- 顶栏 -->
    <header class="topbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <div class="brand-mark">
          <svg class="icon"><use href="#i-knot"/></svg>
        </div>
        <span class="brand-name">KnotYup</span>
      </div>
      <div class="topbar-right">
        <!-- 群信息分享（群主，群页面显示） -->
        <div class="theme-picker hidden" id="sharePicker">
          <button id="btnShare" class="icon-btn" title="Group Info">
            <svg class="icon"><use href="#i-share"/></svg>
          </button>
          <div id="sharePop" class="share-pop hidden"></div>
        </div>
        <div class="theme-picker">
          <button id="btnTheme" class="icon-btn" title="Theme">
            <svg class="icon"><use href="#i-palette"/></svg>
          </button>
          <div id="themeSwatches" class="theme-swatches hidden"></div>
        </div>
        <div class="theme-picker">
          <button id="btnLang" class="icon-btn" title="Language">简</button>
          <div id="langMenu" class="lang-menu hidden"></div>
        </div>
      </div>
    </header>

    <!-- 主内容：未入组 -->
    <main id="viewHome" class="view home">
      <div class="hero">
        <h1><span data-i18n="tagline_1"></span><em data-i18n="tagline_2"></em></h1>
        <p data-i18n="tagline_sub"></p>
      </div>
      <div class="cards">
        <!-- 左卡：加入 / 创建 -->
        <section class="card join" style="--i:0">
          <div class="card-icon">
            <svg class="icon lg"><use href="#i-link"/></svg>
          </div>
          <h2 data-i18n="join_group"></h2>
          <p data-i18n="join_desc"></p>
          <input id="inputAddr" class="input" data-i18n-placeholder="addr_placeholder" spellcheck="false" />
          <input id="inputPin" class="input" data-i18n-placeholder="pin_placeholder" maxlength="6" inputmode="numeric" spellcheck="false" />
          <div class="btn-row">
            <button class="btn" id="btnCreate">
              <svg class="icon sm"><use href="#i-plus"/></svg>
              <span data-i18n="btn_create"></span>
            </button>
            <button class="btn primary" id="btnJoin" data-i18n="btn_join"></button>
          </div>
        </section>

        <!-- 右卡：局域网发现的群 -->
        <section class="card discovered-card" style="--i:1">
          <div class="card-icon">
            <svg class="icon lg"><use href="#i-devices"/></svg>
          </div>
          <h2 data-i18n="discovered"></h2>
          <p data-i18n="discovering"></p>
          <div class="discovered-list" id="discoveredList"></div>
        </section>
      </div>
    </main>

    <!-- 主内容：已入组 -->
    <main id="viewGroup" class="view group hidden">
      <aside class="panel members-panel">
        <div class="panel-head">
          <svg class="icon sm muted"><use href="#i-devices"/></svg>
          <h2 data-i18n="devices"></h2>
          <span id="memberCount" class="count">1</span>
        </div>
        <ul id="memberList" class="member-list"></ul>

        <button class="btn danger" id="btnLeave"></button>
      </aside>

      <section class="panel clip-panel">
        <div class="panel-head">
          <svg class="icon sm muted"><use href="#i-clipboard"/></svg>
          <h2 data-i18n="clipboard"></h2>
          <span class="hint" data-i18n="click_hint"></span>
        </div>
        <ul id="clipList" class="clip-list">
          <li class="empty" id="clipEmpty"></li>
        </ul>
      </section>
    </main>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- 确认弹窗 -->
    <div id="confirmModal" class="modal-overlay hidden">
      <div class="modal">
        <h3 id="confirmTitle"></h3>
        <p id="confirmMsg"></p>
        <div id="confirmList" class="confirm-list hidden"></div>
        <div class="modal-actions">
          <button class="btn" id="confirmCancel"></button>
          <button class="btn danger" id="confirmOk"></button>
        </div>
      </div>
    </div>

    <!-- 加入群（PIN）弹窗 -->
    <div id="pinModal" class="modal-overlay hidden">
      <div class="modal">
        <h3 id="pinTitle"></h3>
        <p id="pinAddr" class="pin-addr"></p>
        <input id="pinInput" class="input" maxlength="6" inputmode="numeric" spellcheck="false" />
        <div class="modal-actions">
          <button class="btn" id="pinCancel"></button>
          <button class="btn primary" id="pinJoin"></button>
        </div>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
